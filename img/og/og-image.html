<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creattium Studio — OG Image</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;");
@font-face {
  font-family: Neo Gray;
  src: url("../../fonts/NeogreyMedium.otf") format("opentype");
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #000000;
  }

  .og-canvas {
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 70px;
  }

  .cmh-brand-icon {
    width: 224px;
    height: 223px;
    display: block;
  }

  .cmh-brand-wordmark {
    color: #ff1e00;
    font-family: Neo Gray;
    font-size: 75px;
    font-weight: 500;
    letter-spacing: 4px;
    line-height: 1;
    margin: 0;
    text-transform: none;
    text-align: center;
  }

  .og-tagline {
    color: #fbffe5;
    font-family: "Outfit", sans-serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.1rem;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="og-canvas">
    <img src="../../img/logo/creattium-logo.svg" class="cmh-brand-icon" alt="" />
    <p class="cmh-brand-wordmark">creattium</p>
    <p class="og-tagline">[ Independent Game Design &amp; Production Partner ]</p>
  </div>
</body>
</html>
